<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antigravity — Access Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-void: #05060f;
  --panel: rgba(10, 12, 30, 0.85);
  --neon-purple: #b44aff;
  --neon-blue: #00d4ff;
  --neon-cyan: #00ffcc;
  --neon-red: #ff3366;
  --text: #c8d6e5;
  --text-dim: #5a6a7a;
  --border: rgba(180, 74, 255, 0.25);
  --glow-purple: 0 0 20px rgba(180, 74, 255, 0.4), 0 0 60px rgba(180, 74, 255, 0.15);
  --glow-blue: 0 0 20px rgba(0, 212, 255, 0.4), 0 0 60px rgba(0, 212, 255, 0.15);
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}

body {
  background: var(--bg-void);
  color: var(--text);
  font-family: var(--font-mono);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── Star field ─────────────────────── */
#starfield {
  position: fixed; inset: 0;
  z-index: 0;
}
#starfield canvas { width: 100%; height: 100%; }

/* ── Login container ────────────────── */
.login-wrapper {
  position: relative;
  z-index: 2;
  width: 420px;
  padding: 48px 40px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  backdrop-filter: blur(24px);
  box-shadow: var(--glow-purple), inset 0 1px 0 rgba(180, 74, 255, 0.1);
}

.login-wrapper::before {
  content: '';
  position: absolute; top: -1px; left: 20%; right: 20%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
}

.logo-section {
  text-align: center;
  margin-bottom: 36px;
}
.logo-section h1 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo-section .sub {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 4px;
  margin-top: 6px;
  text-transform: uppercase;
}

/* ── Tabs ───────────────────────────── */
.auth-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
}
.auth-tabs button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 2px;
  padding: 10px 0;
  cursor: pointer;
  transition: all 0.3s;
  border-bottom: 2px solid transparent;
  text-transform: uppercase;
}
.auth-tabs button.active {
  color: var(--neon-purple);
  border-bottom-color: var(--neon-purple);
  text-shadow: 0 0 12px rgba(180, 74, 255, 0.5);
}
.auth-tabs button:hover:not(.active) { color: var(--text); }

/* ── Form ───────────────────────────── */
.form-group {
  margin-bottom: 20px;
  position: relative;
}
.form-group label {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.form-group input {
  width: 100%;
  background: rgba(10, 12, 30, 0.6);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 12px 14px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.form-group input:focus {
  border-color: var(--neon-purple);
  box-shadow: 0 0 12px rgba(180, 74, 255, 0.25), inset 0 0 8px rgba(180, 74, 255, 0.05);
}
.form-group input::placeholder { color: var(--text-dim); }

.confirm-field { display: none; }
.confirm-field.show { display: block; }

.submit-btn {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--neon-purple);
  background: linear-gradient(135deg, rgba(180, 74, 255, 0.15), rgba(0, 212, 255, 0.08));
  color: var(--neon-purple);
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 8px;
}
.submit-btn:hover {
  background: linear-gradient(135deg, rgba(180, 74, 255, 0.3), rgba(0, 212, 255, 0.15));
  box-shadow: var(--glow-purple);
  color: #fff;
}

/* ── Status message ─────────────────── */
.status-msg {
  text-align: center;
  font-size: 12px;
  margin-top: 16px;
  min-height: 18px;
  transition: all 0.3s;
}
.status-msg.error { color: var(--neon-red); text-shadow: 0 0 8px rgba(255, 51, 102, 0.3); }
.status-msg.success { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 255, 204, 0.3); }

/* ── Scan line decoration ───────────── */
.scan-line {
  position: fixed; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 20%, rgba(180,74,255,0.08) 50%, transparent 80%);
  z-index: 1;
  animation: scanDown 8s linear infinite;
  pointer-events: none;
}
@keyframes scanDown { 0% { top: -2px; } 100% { top: 100vh; } }
</style>
</head>
<body>

<div class="scan-line"></div>
<div id="starfield"></div>

<div class="login-wrapper">
  <div class="logo-section">
    <h1>ANTIGRAVITY</h1>
    <div class="sub">Zero-G Inventory System</div>
  </div>

  <div class="auth-tabs">
    <button class="active" onclick="switchTab('login')">Login</button>
    <button onclick="switchTab('register')">Register</button>
  </div>

  <form id="authForm" onsubmit="handleAuth(event)">
    <div class="form-group">
      <label>Commander ID</label>
      <input type="text" id="username" placeholder="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Access Key</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <div class="form-group confirm-field" id="confirmGroup">
      <label>Confirm Access Key</label>
      <input type="password" id="confirmPw" placeholder="••••••••">
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">INITIATE LOGIN</button>
  </form>

  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
/* ── Star field canvas ────────────── */
(function(){
  const c = document.createElement('canvas');
  document.getElementById('starfield').appendChild(c);
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width = innerWidth; c.height = innerHeight; initStars(); }
  function initStars(){
    stars = [];
    for(let i = 0; i < 220; i++){
      stars.push({ x: Math.random()*c.width, y: Math.random()*c.height,
        r: Math.random()*1.4+0.2, v: Math.random()*0.35+0.05,
        o: Math.random()*0.6+0.2 });
    }
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,220,255,'+s.o+')';
      ctx.fill();
      s.y += s.v;
      if(s.y > c.height){ s.y = 0; s.x = Math.random()*c.width; }
    });
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize);
  resize(); draw();
})();

/* ── Tab switching ────────────────── */
let mode = 'login';
function switchTab(m){
  mode = m;
  document.querySelectorAll('.auth-tabs button').forEach((b,i)=>{
    b.classList.toggle('active', (i===0 && m==='login') || (i===1 && m==='register'));
  });
  document.getElementById('confirmGroup').classList.toggle('show', m==='register');
  document.getElementById('submitBtn').textContent = m==='login' ? 'INITIATE LOGIN' : 'REQUEST CLEARANCE';
  document.getElementById('statusMsg').textContent = '';
}

/* ── Auth handler ─────────────────── */
async function handleAuth(e){
  e.preventDefault();
  const msg = document.getElementById('statusMsg');
  const user = document.getElementById('username').value.trim();
  const pw = document.getElementById('password').value;

  if(mode === 'register'){
    if(pw !== document.getElementById('confirmPw').value){
      msg.className = 'status-msg error'; msg.textContent = 'Passwords do not match.'; return;
    }
  }

  try {
    const url = mode === 'login' ? '/api/login' : '/api/register';
    const res = await fetch(url, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: user, password: pw})
    });
    const data = await res.json();
    msg.className = data.ok ? 'status-msg success' : 'status-msg error';
    msg.textContent = data.msg;
    if(data.ok && mode === 'login') setTimeout(()=> location.href = '/dashboard', 800);
    if(data.ok && mode === 'register') setTimeout(()=> switchTab('login'), 1200);
  } catch(err){
    msg.className = 'status-msg error'; msg.textContent = 'Connection lost.';
  }
}
</script>
</body>
</html>
